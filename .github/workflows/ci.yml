name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --all-groups
      - name: Lint and format check
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Unit and contract tests
        run: uv run python -m unittest discover -s tests -v
      - name: Validate public examples
        run: uv run ael validate examples
      - name: Check generated public results and frozen evidence
        run: |
          uv run ael study preflight \
            studies/quality-preflight/examples/pass/quality-profile.json \
            --json-output studies/quality-preflight/examples/pass/preflight.json \
            --markdown-output studies/quality-preflight/examples/pass/preflight.md \
            --check
          uv run ael results check studies/public-results.json --require-git-proof
          uv run python tools/check_frozen_artifacts.py
      - name: Validate Agent Skills Season 1
        run: |
          uv run ael source-lock check studies/agent-skills-season-1/sources.lock.toml
          uv run ael study freeze-check \
            studies/agent-skills-season-1/screening/property-based-testing-v2.freeze.json
          uv run ael study audit \
            --freeze studies/agent-skills-season-1/screening/property-based-testing-v2.freeze.json \
            --result studies/agent-skills-season-1/results/property-based-testing-v2 \
            --decision-adapter pbt-v2 \
            --require-git-proof
          uv run ael study audit \
            --freeze studies/agent-skills-season-1/screening/systematic-debugging-real-shadow.freeze.json \
            --result studies/agent-skills-season-1/results/systematic-debugging-real-shadow-v1 \
            --decision-adapter systematic-debugging-real-shadow-v1 \
            --require-git-proof
          uv run ael validate \
            studies/agent-skills-season-1/concept.json \
            studies/agent-skills-season-1/manifests \
            studies/agent-skills-season-1/calibration/runtime-v1
          uv run ael validate \
            studies/agent-skills-season-1/concept.json \
            studies/agent-skills-season-1/manifests/property-based-testing-v2.study-manifest.json \
            studies/agent-skills-season-1/results/property-based-testing-v2/evidence-receipt.json \
            studies/agent-skills-season-1/results/property-based-testing-v2/measurement-set.json \
            studies/agent-skills-season-1/results/property-based-testing-v2/runs
          uv run python tools/materialize_agent_skills_season.py --check
      - name: Check public release tree
        run: uv run python tools/release_check.py
      - name: Build distributions
        run: |
          uv build
          uv run python tools/verify_release_artifacts.py \
            --expected-version 0.1.0a8 \
            dist/*.whl dist/*.tar.gz

  clean-wheel:
    name: clean wheel install
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Build and install wheel in an empty environment
        run: |
          uv build
          wheel=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
          test -n "$wheel"
          uv venv .release-venv
          uv pip install --python .release-venv/bin/python "$wheel"
          test "$(.release-venv/bin/ael --version)" = "0.1.0a8"
          test "$(.release-venv/bin/python -c 'import importlib.metadata; print(importlib.metadata.version("agentic-evidence-lab"))')" = "0.1.0a8"
          .release-venv/bin/ael study preflight \
            studies/quality-preflight/examples/pass/quality-profile.json \
            --json-output studies/quality-preflight/examples/pass/preflight.json \
            --markdown-output studies/quality-preflight/examples/pass/preflight.md \
            --check
          .release-venv/bin/ael results check studies/public-results.json --require-git-proof
          .release-venv/bin/ael validate examples
          .release-venv/bin/ael validate \
            studies/agent-skills-season-1/concept.json \
            studies/agent-skills-season-1/manifests \
            studies/agent-skills-season-1/calibration/runtime-v1
          .release-venv/bin/ael study freeze-check \
            studies/agent-skills-season-1/screening/property-based-testing-v2.freeze.json
          .release-venv/bin/ael study audit \
            --freeze studies/agent-skills-season-1/screening/property-based-testing-v2.freeze.json \
            --result studies/agent-skills-season-1/results/property-based-testing-v2 \
            --decision-adapter pbt-v2 \
            --require-git-proof
          .release-venv/bin/ael study audit \
            --freeze studies/agent-skills-season-1/screening/systematic-debugging-real-shadow.freeze.json \
            --result studies/agent-skills-season-1/results/systematic-debugging-real-shadow-v1 \
            --decision-adapter systematic-debugging-real-shadow-v1 \
            --require-git-proof
          .release-venv/bin/ael validate \
            studies/agent-skills-season-1/concept.json \
            studies/agent-skills-season-1/manifests/property-based-testing-v2.study-manifest.json \
            studies/agent-skills-season-1/results/property-based-testing-v2/evidence-receipt.json \
            studies/agent-skills-season-1/results/property-based-testing-v2/measurement-set.json \
            studies/agent-skills-season-1/results/property-based-testing-v2/runs

  docker-smoke:
    name: docker isolation smoke
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Build runner images
        run: |
          docker build --pull=false --tag kizz/ael-runner:0.1.0-alpha.1 docker/runner
          docker build --pull=false --tag kizz/ael-codex-runner:0.146.0 docker/codex-runner
          docker build --pull=false --tag kizz/ael-egress-proxy:0.1.0-alpha.1 docker/egress-proxy
      - name: Run offline isolation smoke
        run: |
          output=$(mktemp -d)
          uv run ael sandbox run \
            --fixture docker/runner/smoke-fixture \
            --output "$output/result" \
            --image kizz/ael-runner:0.1.0-alpha.1 \
            -- python mutate.py
          test -f "$output/result/sandbox-invocation.json"
      - name: Reproduce Agent Skills Season 1 public calibration
        run: |
          output=$(mktemp -d)
          uv run ael taskpack check-adaptation \
            studies/agent-skills-season-1/task-pack/calibration-v1 \
            --output "$output/result" \
            --image kizz/ael-runner:0.1.0-alpha.1
      - name: Check Codex image without credentials
        run: docker run --rm --entrypoint codex kizz/ael-codex-runner:0.146.0 --version
